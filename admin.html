<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor do site</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:26px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{font-size:22px;margin:0}.top a{color:#aaa;text-decoration:none}.panel{background:#131317;border:1px solid #292930;border-radius:18px;padding:18px}.login{max-width:460px;margin:10vh auto}.muted{color:#8d8d97;font-size:14px;line-height:1.5}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;color:#aaa}.field input,.field textarea{width:100%;border:1px solid #33333b;background:#0d0d10;color:#fff;border-radius:10px;padding:10px 11px;outline:none}.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#f4f4f5;color:#111;font-weight:700}.btn.secondary{background:#222228;color:#eee;border:1px solid #36363e}.btn.danger{background:#31191c;color:#ffc0c6;border:1px solid #5f272d}.btn:disabled{opacity:.5}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.status{font-size:13px;color:#999}.ok{color:#8fe3a8}.bad{color:#ff9aa4}.editor{display:none}.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}.sticky{position:sticky;top:16px;height:max-content}.images{display:grid;gap:10px}.image{display:grid;grid-template-columns:95px 1fr;gap:10px;border:1px solid #2b2b32;background:#0f0f12;border-radius:13px;padding:10px}.thumb{width:95px;height:95px;border-radius:9px;background:#19191e;overflow:hidden;display:grid;place-items:center;color:#666;font-size:12px}.thumb img{width:100%;height:100%;object-fit:cover}.mini{display:grid;gap:7px}.mini input{width:100%;border:1px solid #33333a;background:#141418;color:#fff;border-radius:8px;padding:7px 8px}.small{font-size:12px;padding:6px 8px}.preview{border:1px solid #2b2b32;border-radius:16px;overflow:hidden;background:#09090b}.preview iframe{display:block;width:100%;height:620px;border:0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.section-title h2{font-size:17px;margin:0}.hidden{display:none!important}@media(max-width:860px){.grid{grid-template-columns:1fr}.sticky{position:static}.preview iframe{height:500px}}@media(max-width:560px){.row{grid-template-columns:1fr}.image{grid-template-columns:75px 1fr}.thumb{width:75px;height:75px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Editor do site</h1><a href="./" target="_blank">abrir site ↗</a></div>

  <section class="panel login" id="login">
    <h2 style="margin-top:0">Entrar</h2>
    <p class="muted">Digite a senha que você cadastrou no Cloudflare. O Worker já está configurado automaticamente.</p>
    <div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="actions"><button class="btn" id="loginBtn">Entrar</button><span id="loginStatus" class="status"></span></div>
  </section>

  <section class="editor" id="editor">
    <div class="actions" style="margin-bottom:14px">
      <button class="btn" id="saveBtn">Salvar no GitHub</button>
      <button class="btn secondary" id="reloadBtn">Recarregar</button>
      <span id="saveStatus" class="status"></span>
    </div>

    <div class="grid">
      <div style="display:grid;gap:16px">
        <section class="panel">
          <div class="section-title"><h2>Textos</h2></div>
          <div class="row">
            <div class="field"><label>Nome curto</label><input data-key="siteName"></div>
            <div class="field"><label>Título da aba</label><input data-key="pageTitle"></div>
          </div>
          <div class="field"><label>Texto pequeno</label><input data-key="eyebrow"></div>
          <div class="field"><label>Título principal</label><textarea data-key="heroTitle"></textarea></div>
          <div class="field"><label>Descrição</label><textarea data-key="lead"></textarea></div>
          <div class="field"><label>Texto de baixo</label><textarea data-key="text"></textarea></div>
          <div class="field"><label>Rodapé</label><input data-key="footer"></div>
          <div class="field"><label>Cor de fundo</label><input data-key="background" type="color" style="height:46px;padding:4px"></div>
        </section>

        <section class="panel">
          <div class="section-title"><h2>Imagens</h2><button class="btn secondary small" id="addImageBtn">+ adicionar</button></div>
          <div id="images" class="images"></div>
          <p id="empty" class="muted">Nenhuma imagem ainda.</p>
        </section>
      </div>

      <aside class="sticky">
        <div class="preview"><iframe id="preview" src="./"></iframe></div>
      </aside>
    </div>
  </section>
</div>
<script>
const WORKER='https://p-editor.silasfilho765.workers.dev';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let password=sessionStorage.getItem('p_admin_password')||'';
let state=null;
const pendingFiles=new Map();
$('#password').value=password;
function status(el,text,type=''){el.textContent=text;el.className='status '+type}
async function api(path,opt={}){const headers={...(opt.headers||{}),Authorization:'Bearer '+password};if(opt.body)headers['Content-Type']='application/json';return fetch(WORKER+path,{...opt,headers})}
async function login(){password=$('#password').value;if(!password)return status($('#loginStatus'),'Digite a senha.','bad');$('#loginBtn').disabled=true;status($('#loginStatus'),'verificando...');try{const r=await api('/auth',{method:'POST'});if(!r.ok)throw new Error(r.status===401?'Senha incorreta.':'Falha ao falar com o Worker.');sessionStorage.setItem('p_admin_password',password);await load();$('#login').classList.add('hidden');$('#editor').style.display='block'}catch(e){status($('#loginStatus'),e.message,'bad')}finally{$('#loginBtn').disabled=false}}
async function load(){const r=await fetch('./site.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Não consegui carregar o site.');state=await r.json();state.gallery=Array.isArray(state.gallery)?state.gallery:[];pendingFiles.clear();fill();renderImages();refreshPreview()}
function fill(){$$('[data-key]').forEach(el=>el.value=state[el.dataset.key]??'')}
function collect(){$$('[data-key]').forEach(el=>state[el.dataset.key]=el.value)}
function renderImages(){const box=$('#images');box.innerHTML='';$('#empty').style.display=state.gallery.length?'none':'block';state.gallery.forEach((item,i)=>{const row=document.createElement('div');row.className='image';const th=document.createElement('div');th.className='thumb';const src=item.preview||item.src;if(src){const im=document.createElement('img');im.src=src;th.appendChild(im)}else th.textContent='sem imagem';const mini=document.createElement('div');mini.className='mini';const label=document.createElement('input');label.placeholder='Legenda';label.value=item.label||'';label.oninput=()=>item.label=label.value;const alt=document.createElement('input');alt.placeholder='Descrição';alt.value=item.alt||'';alt.oninput=()=>item.alt=alt.value;const url=document.createElement('input');url.placeholder='URL da imagem';url.value=item.uploadId?'':(item.src||'');url.oninput=()=>{item.src=url.value.trim();item.uploadId='';item.preview='';renderImages()};const actions=document.createElement('div');actions.className='actions';const file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp,image/gif';file.className='hidden';file.id='f'+i;file.onchange=()=>selectFile(i,file.files[0]);const choose=document.createElement('label');choose.htmlFor=file.id;choose.className='btn secondary small';choose.textContent='arquivo';const up=btn('↑',()=>move(i,-1)),down=btn('↓',()=>move(i,1)),del=btn('remover',()=>remove(i),'danger');actions.append(choose,file,up,down,del);mini.append(label,alt,url,actions);row.append(th,mini);box.appendChild(row)})}
function btn(text,fn,extra='secondary'){const b=document.createElement('button');b.className='btn '+extra+' small';b.textContent=text;b.onclick=fn;return b}
function addImage(){state.gallery.push({src:'',label:'imagem',alt:''});renderImages()}
function move(i,d){const j=i+d;if(j<0||j>=state.gallery.length)return;[state.gallery[i],state.gallery[j]]=[state.gallery[j],state.gallery[i]];renderImages()}
function remove(i){const item=state.gallery[i];if(item.uploadId)pendingFiles.delete(item.uploadId);state.gallery.splice(i,1);renderImages()}
function selectFile(i,file){if(!file)return;if(file.size>3*1024*1024)return alert('Máximo 3 MB por imagem.');const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());pendingFiles.set(id,file);state.gallery[i].uploadId=id;state.gallery[i].preview=URL.createObjectURL(file);state.gallery[i].src='';renderImages()}
function filePayload(id,file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({id,name:file.name,type:file.type,data:String(r.result).split(',')[1]});r.onerror=reject;r.readAsDataURL(file)})}
async function save(){collect();$('#saveBtn').disabled=true;status($('#saveStatus'),'salvando...');try{const files=[];for(const [id,file] of pendingFiles)files.push(await filePayload(id,file));const config=JSON.parse(JSON.stringify(state));config.gallery.forEach(x=>delete x.preview);const r=await api('/save',{method:'POST',body:JSON.stringify({config,files})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Falha ao salvar.');state=data.config||config;pendingFiles.clear();fill();renderImages();status($('#saveStatus'),'salvo ✓','ok');setTimeout(refreshPreview,1800)}catch(e){status($('#saveStatus'),e.message,'bad')}finally{$('#saveBtn').disabled=false}}
function refreshPreview(){$('#preview').src='./?t='+Date.now()}
$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#saveBtn').onclick=save;$('#reloadBtn').onclick=()=>load().catch(e=>status($('#saveStatus'),e.message,'bad'));$('#addImageBtn').onclick=addImage;
</script>
</body>
</html>
